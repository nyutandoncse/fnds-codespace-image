name: Build and publish Codespace base image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'environment.yml'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nyutandoncse/fnds-codespace:fa26
            ghcr.io/nyutandoncse/fnds-codespace:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
